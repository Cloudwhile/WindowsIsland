name: Windows Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s release.md
          grep -Fxq "# Windows Island $RELEASE_TAG" release.md

      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: WindowsIsland-win-x64
          path: distribution

      - name: Verify package checksum
        working-directory: distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for extension in zip msi; do
            name="WindowsIsland-${RELEASE_TAG#v}-win-x64.$extension"
            test -s "$name"
            sha256sum --check "$name.sha256"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="WindowsIsland-${RELEASE_TAG#v}-win-x64"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            options=(--verify-tag --notes-file release.md --draft --title "Windows Island $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" "distribution/$name.zip" "distribution/$name.zip.sha256" \
            "distribution/$name.msi" "distribution/$name.msi.sha256" --clobber
          gh release edit "$RELEASE_TAG" --notes-file release.md --draft=false
