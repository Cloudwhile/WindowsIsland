name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build, test and package x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check standard-user test context
        run: ./packaging/Invoke-StandardUserCheck.ps1 -Script Test-Inno.ps1 -Probe

      - name: Prepare isolated installer policies
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Installer policies may only be prepared on disposable GitHub-hosted runners.'
          }
          $key = 'HKLM:/SOFTWARE/Microsoft/Windows/CurrentVersion/AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowAllTrustedApps -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Set package version
        id: version
        run: |
          $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore application
        run: dotnet restore src/WindowsIsland/WindowsIsland.csproj -p:Platform=x64

      - name: Build application and native modules
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build src/WindowsIsland/WindowsIsland.csproj -c Release -p:Platform=x64 "-p:Version=$env:APP_VERSION" --no-restore

      - name: Run notification logic checks
        run: dotnet run --project tests/WindowsIsland.LogicTests/WindowsIsland.LogicTests.csproj -c Release

      - name: Compile plugin documentation examples
        run: ./packaging/Test-PluginDocs.ps1
      - name: Validate standalone plugin CLI
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/Test-PluginCli.ps1 -Version $env:APP_VERSION -OutputRoot (Join-Path $env:RUNNER_TEMP ('wini-sdk-' + [Guid]::NewGuid().ToString('N')))

      - name: Check external plugin isolation
        timeout-minutes: 5
        run: >-
          dotnet run --project tests/WindowsIsland.PluginSecurityTests/WindowsIsland.PluginSecurityTests.csproj -c Release --
          --worker artifacts/bin/WindowsIsland.PluginWorker/x64/Release/net10.0/win-x64
          --fixture artifacts/bin/WindowsIsland.PluginSecurityFixture/Release/net10.0/WindowsIsland.PluginSecurityFixture.dll

      - name: Build and verify standalone plugin SDK
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/Test-PluginSdk.ps1 -Version $env:APP_VERSION -OutputRoot (Join-Path $env:RUNNER_TEMP 'wini-sdk')

      - name: Upload standalone plugin SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WindowsIsland-plugin-sdk
          path: ${{ runner.temp }}/wini-sdk/feed/*
          if-no-files-found: error
          retention-days: 14

      - name: Check update manifest generation
        run: ./packaging/Test-UpdateManifest.ps1

      - name: Check release asset validation
        run: ./packaging/Test-ReleaseAssetsRegression.ps1

      - name: Check installer policy snapshots
        run: ./packaging/Test-InstallerPolicy.ps1

      - name: Check Inno conversion recovery
        run: ./packaging/Test-InnoConversion.ps1

      - name: Check Shell icon alpha
        run: dotnet run --project tests/WindowsIsland.IconTests/WindowsIsland.IconTests.csproj -c Release

      - name: Run Telegram bridge checks
        run: dotnet run --project tests/WindowsIsland.TelegramHookTests/WindowsIsland.TelegramHookTests.csproj -c Release

      - name: Publish application
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet publish src/WindowsIsland/WindowsIsland.csproj -c Release -p:Platform=x64 "-p:Version=$env:APP_VERSION" --no-build --no-restore

      - name: Check published runtime files
        run: ./packaging/Test-PublishRuntime.ps1

      - name: Package Windows application
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish'
          $required = @(
            'WindowsIsland.exe', 'WindowsIsland.dll', 'WindowsIsland.deps.json',
            'WindowsIsland.runtimeconfig.json', 'WindowsIsland.TelegramHook.dll',
            'WindowsIsland.pri', 'App.xbf', 'Microsoft.UI.Xaml.dll', 'coreclr.dll',
            'en-US/WindowsIsland.resources.dll',
            'hostfxr.dll', 'Assets/Island.ico', 'Icons/LOGO.png', 'Initialization/AppxManifest.xml',
            'Initialization/RuntimeManifest.xml', 'Licenses/MinHook.txt', 'Unregister-Package.ps1',
            'Assets/Shell/AppList.png', 'Assets/Shell/MediumTile.png', 'Assets/Shell/StoreLogo.png',
            'Assets/Shell/AppList.targetsize-24_altform-unplated.png',
            'Assets/Shell/AppList.targetsize-24_altform-lightunplated.png'
          )
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath (Join-Path $publish $file) -PathType Leaf)) {
              throw "Publish output is incomplete: $file"
            }
          }
          Copy-Item -LiteralPath LICENSE -Destination (Join-Path $publish 'LICENSE')
          Copy-Item -LiteralPath README.md -Destination (Join-Path $publish 'README.md')
          Copy-Item -LiteralPath README.zh-CN.md -Destination (Join-Path $publish 'README.zh-CN.md')
          $distribution = Join-Path $env:GITHUB_WORKSPACE 'artifacts/distribution'
          New-Item -ItemType Directory -Path $distribution -Force | Out-Null
      - name: Set up Inno Setup
        shell: pwsh
        run: |
          $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (!$isccPath) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $isccPath = $candidate
            }
          }
          if (!$isccPath) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (!$isccPath) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          Write-Output "Using Inno Setup compiler: $isccPath"

      - name: Build Inno Setup installer
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/Build-Inno.ps1 -Version $env:APP_VERSION

      - name: Collect and verify release assets
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'wini-sdk/feed') -File | Copy-Item -Destination artifacts/distribution
          ./packaging/Test-ReleaseAssets.ps1 -Directory artifacts/distribution -Version $env:APP_VERSION

      - name: Check isolated Inno installation and removal
        run: ./packaging/Invoke-StandardUserCheck.ps1 -Script Test-Inno.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WindowsIsland-win-x64
          path: artifacts/distribution/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WindowsIsland-diagnostics
          include-hidden-files: true
          path: |
            artifacts/verification/**/*.log
            artifacts/verification/**/*.json
            ${{ runner.temp }}/wini-sdk*/**/*.log
            ${{ runner.temp }}/wini-sdk*/**/*.json
          if-no-files-found: ignore
          retention-days: 7
